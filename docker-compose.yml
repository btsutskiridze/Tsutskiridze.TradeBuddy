services:
  tradebuddy:
    image: ${REGISTRY_HOST}/${IMAGE_NAME}:${IMAGE_TAG}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    env_file:
      - .env
    volumes:
      - playwright_cache:/app/ms-playwright
      - ./logs:/app/logs

volumes:
  playwright_cache:

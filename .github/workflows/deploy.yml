name: CI/CD -> DigitalOcean Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: Development
    
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Droplet
        run: |
          ssh -o StrictHostKeyChecking=no \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            
            # ensure project dir exists
            mkdir -p ~/StockBuddy.API
            cd ~/StockBuddy.API

            # (Re-)write env file from GitHub Secrets
            echo "ASPNETCORE_ENVIRONMENT=${{ secrets.ASPNETCORE_ENVIRONMENT }}" > .env
            echo "ASPNETCORE_URLS=${{ secrets.ASPNETCORE_URLS }}" >> .env

            echo "ALLOWEDHOSTS=${{ secrets.ALLOWEDHOSTS }}" >> .env
            echo "CORS__ALLOWEDORIGINS=${{ secrets.CORS__ALLOWEDORIGINS }}" >> .env

            echo "CONNECTIONSTRINGS__POSTGRES=${{ secrets.CONNECTIONSTRINGS__POSTGRES }}" >> .env

            echo "SMTP__USER=${{ secrets.SMTP__USER }}" >> .env
            echo "SMTP__PASSWORD=${{ secrets.SMTP__PASSWORD }}" >> .env
            echo "SMTP__HOST=${{ secrets.SMTP__HOST }}" >> .env
            echo "SMTP__PORT=${{ secrets.SMTP__PORT }}" >> .env
            echo "SMTP__ENABLESSL=${{ secrets.SMTP__ENABLESSL }}" >> .env
            
            echo "ALPHAVANTAGE__APIKEY=${{ secrets.ALPHAVANTAGE__APIKEY }}" >> .env
            echo "ALPHAVANTAGE__BASEURL=${{ secrets.ALPHAVANTAGE__BASEURL }}" >> .env
            
            echo "FMP__APIKEY=${{ secrets.FMP__APIKEY }}" >> .env
            echo "FMP__BASEURL=${{ secrets.FMP__BASEURL }}" >> .env
            
            echo "REDDIT__SEARCHENDPOINT=${{ secrets.REDDIT__SEARCHENDPOINT }}" >> .env
            echo "REDDIT__AUTHENDPOINT=${{ secrets.REDDIT__AUTHENDPOINT }}" >> .env
            echo "REDDIT__CLIENTID=${{ secrets.REDDIT__CLIENTID }}" >> .env
            echo "REDDIT__CLIENTSECRET=${{ secrets.REDDIT__CLIENTSECRET }}" >> .env
            echo "REDDIT__USERNAME=${{ secrets.REDDIT__USERNAME }}" >> .env
            echo "REDDIT__PASSWORD=${{ secrets.REDDIT__PASSWORD }}" >> .env
            echo "REDDIT__USERAGENT=${{ secrets.REDDIT__USERAGENT }}" >> .env
            
            echo "FINNHUB__BASEURL=${{ secrets.FINNHUB__BASEURL }}" >> .env
            echo "FINNHUB__APIKEY=${{ secrets.FINNHUB__APIKEY }}" >> .env
            
            echo "YAHOO__BASEURL=${{ secrets.YAHOO__BASEURL }}" >> .env
            
            echo "AI__GEMINI__APIKEY=${{ secrets.AI__GEMINI__APIKEY }}" >> .env
            echo "AI__GEMINI__MODELID=${{ secrets.AI__GEMINI__MODELID }}" >> .env
            echo "AI__OPENAI__APIKEY=${{ secrets.AI__OPENAI__APIKEY }}" >> .env
            echo "AI__OPENAI__MODELID=${{ secrets.AI__OPENAI__MODELID }}" >> .env
            
            echo "TELEGRAM__BOTTOKEN=${{ secrets.TELEGRAM__BOTTOKEN }}" >> .env
            echo "TELEGRAM__GROUPCHATID=${{ secrets.TELEGRAM__GROUPCHATID }}" >> .env
            echo "TELEGRAM__PERSONALCHATID=${{ secrets.TELEGRAM__PERSONALCHATID }}" >> .env

            chmod 600 .env

            # Clone or update source
            if [ -d .git ]; then
              git pull origin main
            else
              git clone https://github.com/${{ github.repository }} . 
            fi

            # Build & launch
            docker compose pull || true
            docker compose up -d --build

            docker system prune -af --volumes
          
          EOF
